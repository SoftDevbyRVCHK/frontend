<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="windows-1251">
    <title>Создание модулей.</title>
    <link rel="stylesheet" href="css/modules.css">
</head>
<body id="body">
<input type="file" id="fileInput" hidden>
<a id="download" hidden></a>
<div class="Settings" id="SettingLayer" hidden>
    <button id="LoadFloor">Текстура пола</button>
    <button id="ClearFloor">сбросить</button>
<!--    <button id="ILoad">Догрузка</button>-->
</div>
<div class="grid-container">
    <div class="Special">
        <svg id="canvas">
            <g id="layer0"></g>
            <g id="layer1"></g>
            <g id="fixed"></g>
            <g id="layer2"></g>
            <g id="layer3"></g>
            <text></text>
    </svg></div>
    <div class="grid-item"></div>
    <div class="grid-item"></div>
    <div style="text-align: right" class="grid-item">
        <button style="transform: scale(min(1, calc(5vmin / 32px)));" id="settings">
            <img src="data/icons/settings.png"></button></div>

    <div class="grid-item3"><button id="mode">Режим: Расстановка полов/значков</button></div>

    <div class="grid-item3"><button id="new">Новое</button></div>

    <div class="grid-item3"><button id="load">Загрузить</button></div>

    <div class="grid-item3"><button id="save">Сохранить</button></div>

    <div class="grid-item"></div>
    <div class="grid-item"><button id="up">^</button></div>
    <div class="grid-item"></div>

    <div class="grid-item" style="text-align: right"><button id="left"><</button></div>
    <div class="grid-item"></div>
    <div class="grid-item" style="text-align: left"><button id="right">></button></div>

    <div class="grid-item"></div>
    <div class="grid-item"><button id="down">v</button></div>
    <div class="grid-item"></div>
</div>
<script src="js/d3.v7.min.js"></script>
<script src="js/module_create.js"></script>
</body>
</html>
